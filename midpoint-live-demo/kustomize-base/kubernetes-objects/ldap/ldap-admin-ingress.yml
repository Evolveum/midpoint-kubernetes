apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phpldapadmin-ingress
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - demo.example.com
      secretName: cert-mp-demo
  rules:
    - host: demo.example.com
      http:
        paths:
          - path: /ldapadmin
            pathType: Prefix
            backend:
              service:
                name: apache-service
                port:
                  number: 80

